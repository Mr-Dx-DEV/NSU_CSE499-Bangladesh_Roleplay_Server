endpoint_add_tcp "0.0.0.0:30120"
endpoint_add_udp "0.0.0.0:30120"
set es_enableCustomData 1


# These resources will start by default.
ensure mapmanager
ensure chat
ensure spawnmanager
ensure sessionmanager
ensure basic-gamemode
ensure baseevents
ensure sjfw
ensure connectqueue
ensure oxmysql
ensure GG_whitelist
ensure GG_roles
ensure menuv
ensure sjrp-target
ensure PolyZone
ensure polyzonehelper
ensure sjrp-doorlock

####-Resources-#####
exec resources.cfg
#exec permissions.cfg
sv_scriptHookAllowed 0
#rcon_password ""
exec perms.cfg

sets banner_detail "https://r2.fivemanage.com/4uCEt1HrBEiC8QdPoWTP1/CodexImageAug20202610_48_28AM.png"
sets banner_connecting "https://r2.fivemanage.com/4uCEt1HrBEiC8QdPoWTP1/CodexImageAug20202610_48_28AM.png"


sv_hostname "Bangladesh Roleplay Server || Police | EMS | Gang | Mafia"
sets sv_projectName "Bangladesh Roleplay Server | Whitelisted"
sets sv_projectDesc "DISCORD: discord.io/sjrpbd"

#DATABASE
set mysql_connection_string "mysql://root@localhost/sjrp?charset=utf8mb4"


sets Discord "✅ https://discord.io/sjrpbd"
sets tags "Bangladesh Roleplay Server | Police | EMS | Gang | Mafia | Whitelisted"
sets locale "en-BD" 
load_server_icon "myLogo.png"
sets Discord "✅ " 
set sv_enforceGameBuild 3407  

set sv_displayqueue true
add_ace resource.uptime command.sets allow
set temp_convar "Welcome TO SJRP"
sv_authMaxVariance 1
sv_authMinTrust 5

# Voice config
setr voice_useNativeAudio true
setr voice_useSendingRangeOnly 1
setr voice_use3dAudio true
setr voice_zoneRadius 256 
setr voice_defaultVolume 0.5
setr voice_enableRadioAnim 1
setr voice_zoneRefreshRate 200
setr voice_enableRadios 1
setr voice_enableSubmix 1
setr voice_defaultRadio "CAPITAL"
setr voice_defaultCycle "GRAVE"

# Hide player endpoints in external log output.
sets Dev "Mr_Dx"
sets Framework "GGFW"

sv_maxclients 10
set steam_webApiKey "CHANGE-ME-STEAM-WEBAPI-KEY"
set sv_licensekey "CHANGE-ME-CFX-LICENSE-KEY"